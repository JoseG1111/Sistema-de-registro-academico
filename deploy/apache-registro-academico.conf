<VirtualHost *:80>
    ServerName 192.168.56.10
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    Alias /static/ /opt/registro-academico/app/views/estudiante/static/
    <Directory /opt/registro-academico/app/views/estudiante/static/>
        Require all granted
    </Directory>

    ProxyPass /static/ !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/registro-academico-error.log
    CustomLog ${APACHE_LOG_DIR}/registro-academico-access.log combined
</VirtualHost>
